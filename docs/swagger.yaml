definitions:
  handler.loginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  handler.loginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/handler.userResponse'
    type: object
  handler.updateMeRequest:
    properties:
      display_name:
        type: string
    type: object
  handler.userResponse:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: string
      login:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  title: Shared Shopping List API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.loginResponse'
      tags:
      - Auth
  /users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: User
          schema:
            $ref: '#/definitions/handler.userResponse'
      security:
      - BearerAuth: []
      tags:
      - Users
    patch:
      consumes:
      - application/json
      parameters:
      - description: Patch
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User
          schema:
            $ref: '#/definitions/handler.userResponse'
      security:
      - BearerAuth: []
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
